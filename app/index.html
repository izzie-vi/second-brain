<script>/* if the app can't start, show why instead of a blank page */
(function(){var errs=window.__errs=[];function note(m){errs.push(String(m||'unknown error').slice(0,300));show()}
window.addEventListener('error',function(e){note(e.message+(e.filename?' ('+e.filename.split('/').pop().split('?')[0]+':'+e.lineno+')':''))},true);
window.addEventListener('unhandledrejection',function(e){var r=e.reason;note(r&&r.message||r)});
window.__fresh=function(){var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}catch(_){}try{if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(_){}Promise.all(p).then(function(){location.reload()},function(){location.reload()})};
function show(){var m=document.getElementById('main'),a=document.getElementById('app'),g=document.getElementById('gate');if(!m||!a)return;if(m.textContent.trim()&&!m.querySelector('.oops'))return;if(g&&!g.hidden)return;a.hidden=false;
 var b=document.getElementById('bootoops');if(!b){b=document.createElement('section');b.id='bootoops';b.className='sec oops';m.appendChild(b)}
 b.innerHTML='<h2>The app couldn\'t start</h2><p class="hint">Your notes are safe. Tap below to load the newest version.</p><p><button class="btn solid" onclick="__fresh()">Reload the app</button></p><p class="small" style="word-break:break-word"></p>';b.lastChild.textContent=errs.join(' · ')}
window.addEventListener('load',function(){setTimeout(function(){var m=document.getElementById('main');if(m&&!m.textContent.trim()){if(!errs.length)errs.push('nothing drawn after start-up');show()}},4000)});
})();</script>
<script>/* light or dark: this device's choice, or the phone's setting */
(function(){var mq=matchMedia('(prefers-color-scheme: dark)');function a(){var p;try{p=localStorage.getItem('sb-theme')}catch(e){}p=p||'auto';var d=p==='dark'||(p==='auto'&&mq.matches);document.documentElement.toggleAttribute('data-dark',d);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#1E1B17':'#F5F1E8'}window.applyTheme=a;a();mq.addEventListener&&mq.addEventListener('change',a)})();</script>
